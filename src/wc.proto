syntax = "proto2";

// Position vectors optimized for values not close to 0
message FixedVector {
        required sfixed32 x = 1;
        required sfixed32 y = 2;
        required sfixed32 z = 3;
}

// Wing commander stored orientations as 32-bit from -256 to 256 inclusive
message Vector {
        required sint32 x = 1;
        required sint32 y = 2;
        required sint32 z = 3;
}

message Location {
        optional FixedVector pos = 1;
        optional Vector vel = 2;
        optional Vector right = 3;
        optional Vector up = 4;
        optional Vector fore = 5;
        optional uint32 set_speed = 6;
}

message Damage {
        optional Vector pos = 1;
        optional uint32 shooter = 2; // 16 bits
        optional uint32 quantity = 3; // 16 bits
        optional uint32 ship_id = 4;
        optional fixed32 seed = 5;
}

message WeaponFire {
        optional uint32 gun_id = 1; // 4 bits
        optional uint32 shooter = 2;
        optional uint32 ship_id = 3; // if missile, which id?
        // Set by a client that already fired locally (client-side prediction).
        // The server echoes it back unchanged so the client can recognise its
        // own shot and only record the missile id mapping instead of firing twice.
        optional uint32 client_seq = 4;
        // Network id of the ship the shooter had locked (dseg:C284[shooter])
        // at the moment of firing; missiles inherit it when spawned, so the
        // replaying machine sets it before calling fireGunFromShip.
        optional uint32 target = 5;
        // The shooter's own record for that gun and how many guns it had,
        // read just before the shot.  A hit can knock a random gun off a
        // ship and the machines do not always pick the same one, so the
        // replaying machine fires what the shooter fired, not whatever its
        // own table has under that number.
        optional bytes gun = 6;
        optional uint32 guns = 7;
}

// Authoritative per-ship health snapshot.  Wing Commander applies damage with
// two different models depending on the ship slot (slot 0 = the local player,
// slots 1-9 = NPC), so the owner of a ship replicates the resulting state
// instead of every machine replaying the hit.  Field comments give the
// data-segment arrays (see scripts/wcdis.py sym dseg:XXXX).
message ShipHealth {
        repeated sint32 shield = 1 [packed=true];      // dseg:C430 curShield[2] (front, rear)
        repeated sint32 shield_max = 2 [packed=true];  // dseg:C988 shieldMax[2]
        repeated sint32 armor = 3 [packed=true];       // dseg:C85E armorState[4]
        optional sint32 damage_points = 4;             // dseg:C17A accumulated hull damage
        optional uint32 core_hp = 5;                   // dseg:C8B8 core hit points (starts at 4)
        optional uint32 hull_counter = 6;              // dseg:D22C internal damage counter
        optional uint32 state_byte = 7;                // dseg:D1A2 ship state
        optional uint32 gun_damage = 8;                // dseg:BD0E
        optional uint32 engine_flag = 9;               // dseg:BFD6
        optional sint32 gun_energy = 10;               // dseg:BE3A
}

message Spawn {
        optional uint32 mission_ship_id = 1;
        optional uint32 situation_id = 2;
        optional uint32 ship_id = 3;
        optional fixed32 seed = 5;
        // dseg:D1A2 of the slot once the mission setup has run: 0-7 one of the
        // eight named wingmen (name, face, orders menu), 8 the player, 9-12 an
        // enemy ace.  The replaying side writes it, since the replayed spawn
        // only builds the ship.
        optional uint32 pilot = 6;
        // A second ship of a mission ship that is in a slot already (Wing
        // Commander's third seat): the game refuses one it finds in its slot
        // table, so the replaying side hides that entry for the call too.
        optional bool again = 7;
}

message Despawn {
        optional uint32 ship_id = 1;
        optional uint32 shooter = 2;
        optional uint32 explode = 3;
}

message ShipUpdate {
        optional uint32 ship_id = 1; // 16 bits
        optional Location loc = 2;
        optional ShipHealth health = 3; // only from the ship's owner
}

enum GameState {
     Proceed = 0;
     EndLand = 1;
     EndEject = 2;
     EndCarrier = 3;
     EndDeath = 4;
     EndExit = 5;
}

enum AutoPilotState {
     Disengaged = 0;
     Engaged = 1;
     Finished = 2;
}

message AutoPilotEvent {
   optional uint32 cam_ship_type = 1;
   optional uint32 cam_mode = 2;
   optional uint32 duration = 3;
   optional bool finish_camera = 4;
}

// A gunner's shot from one of the leader's turrets (WC2): the turret's aim is
// the camera's orientation on the gunner's machine, its place the camera's
// offset from the ship.
message TurretFire {
        optional Vector right = 1;
        optional Vector up = 2;
        optional Vector fore = 3;
        optional Vector offset = 4;
        optional uint32 barrels = 5;  // which pair of barrel offsets (dseg:CDA8)
}

// A ship switched its cloaking device (WC2's stealth fighters).  The
// server's AI decides; the clients' own copies of it are not asked.
message Cloak {
        optional uint32 ship_id = 1;
        optional bool on = 2;
}

// A drone's hand on the leader's ship (its copilot's role in a mission the
// story flies alone): energy moved between the leader's shields and guns,
// and the leader's cruising speed.  From a drone to the server only.
message Copilot {
        enum Action {
                SHIELDS_TO_REAR = 1;     // the Up key
                SHIELDS_TO_FRONT = 2;    // Down
                SHIELDS_TO_GUNS = 3;     // the fire key
                GUNS_TO_WEAKEST = 4;     // the missile key: into whichever shield is lower
                SPEED_UP = 5;            // + and -: the leader's set speed, as the leader's own keys
                SPEED_DOWN = 6;
        }
        optional Action action = 1;
}

message Event {
  optional Spawn spawn = 2;
  optional Damage damage = 3;
  optional WeaponFire fire = 4;
  optional Despawn despawn = 5;
  optional AutoPilotEvent autopiloting = 16;
  optional TurretFire turret = 17;
  optional Cloak cloak = 18;
  optional Copilot copilot = 19;
}

message MissionEnd {
    optional GameState game_update = 1;
    optional bytes mission_tree_progress = 2;
    optional uint32 victory_points_plus_one = 3;
    // Server -> client, Wing Commander II: the host's campaign record as its
    // flight loop returned.  The campaign loop branches on fields of it that
    // the flight fills (the mission's counters, the result at the loop's
    // tail): a wingman's game, given the record, goes the host's way -- a
    // scripted "landing" that is a cutscene and a second flight (Series 1,
    // mission 4) instead of its own plain landing.
    optional bytes campaign_state = 4;
    // Server -> client, Wing Commander 1: the ship the host landed on, as a
    // network id plus one.  The landing sequence draws the carrier from the
    // game's "landed on" word, which only the game's own landing check
    // writes: a wingman landed by the host's word had none, and the Tiger's
    // Claw was missing from its landing.
    optional uint32 landed_on_plus_one = 5;
}

// Client -> server: this player's own mission ended (death or ejection).  The
// server removes the player's ship and the mission continues for everyone
// else.  Landing is still a shared mission end and travels in MissionEnd.
message PlayerEnd {
    optional GameState state = 1;
}

message Frame {
    repeated ShipUpdate update = 1; // one update per updated ship
    repeated Event event = 2;
    optional MissionEnd mission_end = 18;
    optional PlayerEnd player_end = 19;
    // Server -> client: whether the mission has its asteroid and mine fields
    // (1), not (0), or has them with rocks that do little damage to a
    // player's own ship (2).  Sent with the mission start state and when the
    // host changes it in flight; each machine then removes or restores its own.
    optional uint32 rocks = 20;
    // Server -> client: WingBumps (wcnet_events.h): 1 = two humans' ships touch for no damage, 0 = the game's.
    optional uint32 wing_bumps = 27;
    // From a gunner: the turret it mans plus one (0: none), so that the
    // server's automatic fire leaves that turret to it.
    optional uint32 manned_turret = 21;
    // Client -> server: the number of the last server frame this client had
    // applied when it sent this.  The server runs on without waiting for a
    // client's frame, as long as the client is not too many frames behind.
    // Server -> client: the number of the last client frame taken in.
    optional uint64 ack = 22;
    // With the ack: for how long (ms) the acked frame had been here when
    // this one was sent, so that the other side has the round trip from its
    // own clock alone (LinkMonitor in wcnet_session.cpp).
    optional uint32 ack_delay = 23;
    // Client -> server: the client's frames in its last second, the
    // server's view of how the wingman's game is doing.
    optional uint32 fps = 24;
    // Server -> client: the exchange mode from this frame on (ExchangeMode
    // in wcnet_session.h: 1 the client waits for every server frame, 2 it
    // paces itself and takes the server's frames as they come).  Sent with
    // the start state and whenever it changes.
    optional uint32 mode = 25;
    // Client -> server, false: this client's game has left the flight loop
    // for this mission (its landing, the debriefing, the barracks, the DOS
    // prompt).  The server waits for the frames of a wingman in flight,
    // however long a scene holds it; one out of flight is not waited for,
    // nor sent frames, whether or not its ending (player_end) was seen.
    optional bool flying = 26;
    // Server -> client: the network ids of the ships humans fly, the host's 0
    // among them, in every frame and in the start state.  A client holds the
    // AI off these and computes no damage to them (session.h: a human's ship
    // is its owner's), the host's body and the other wingmen's alike.
    repeated uint32 humans = 28;
}

// Connect -> once per mission
message Connect {
    optional string callsign = 1;
    optional string lastname = 2;
}

message Game {
    optional uint32 mission_id = 1;
    required uint32 assigned_player_id = 2;
    optional Frame starting_state = 3;
    // What this client is in the mission (Seat in wcnet_session.h): 0 flies
    // the ship the mission has for a wingman (assigned_player_id is its
    // slot on the server); 1 a drone, for missions the story flies alone: a
    // ship that exists on the client's machine only; 2 the gunner, in such a
    // mission when the leader's ship has turrets: the client rides in it.
    optional uint32 seat = 4;
    // The server's pace, frames a second: a client that paces itself keeps it.
    optional uint32 fps = 5;
    // A gunner: the view it starts in (3 the rear turret, 1 and 2 the side
    // turrets: a second gunner takes another turret).
    optional uint32 start_view = 6;
}

message ClientStartMissionReq {

}
message ClientStartBriefingReq {

}
message Chat {
    optional string message = 1;
    optional uint32 ship_id = 2;
    optional string callsign = 3;
}
message ServerSendBriefingStart {
    optional uint32 mission_id = 1;
    optional bytes mission_tree_progress = 2;
    optional uint32 series_id = 3;
    // As Frame.rocks: known before the client sets up its first nav point.
    optional uint32 rocks = 4;
    optional uint32 wing_bumps = 6;  // WingBumps, as Frame.wing_bumps
    // WC2: the server's campaign record (what a saved game holds: where the
    // story is, who is alive), as it was when "Fly mission" was chosen.  The
    // client takes it over, so that its briefing, its mission and what it
    // finds in them are the server's.
    optional bytes campaign_state = 5;
}
// Server -> client, out of band (polled like chat, so that a wingman waiting
// for a frame sees it): the host's game is starting an in-flight scene of
// the mission's script (WC2: a nav point's cutscene, armed on every machine
// by the nav point's own steps) and sends no frames for its length.  A
// wingman whose game has the same scene pending plays it now, instead of
// after the host's.
message InFlightScene {
    optional uint32 scene = 1;
}
message NetworkMessage {
    optional Connect connect = 1;
    optional Game game = 2;
    optional Frame frame = 3;
    optional ClientStartMissionReq start_mission_req = 4;
    optional uint32 epoch = 5;
    optional uint64 frame_number = 6;
    optional Chat chat = 7;

// handshake
    optional ClientStartBriefingReq start_briefing_req = 16;
    optional ServerSendBriefingStart briefing_start = 17;
    optional InFlightScene in_flight_scene = 18;
}
